name: Validate PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            deps
            docs
            refactor
            test
            chore
            ci
            build
            revert
          subjectPattern: '^[a-z].+$'
          subjectPatternError: >-
            The pull request title description must start with a lowercase
            character. Received "{subject}" in "{title}".
